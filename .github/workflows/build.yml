name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Capacitor CLI Permissions
        run: chmod -R +x node_modules/.bin

      - name: Run Build Script
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios || npx @capacitor/cli sync ios

      - name: Verify iOS Project Exists
        run: |
          if [ -d "ios/App" ] && [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "iOS project exists!"
            ls -la ios/App
          else
            echo "Error: iOS project missing!"
            exit 1
          fi

      - name: Build iOS App Archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r CBT-MTsN6Solok.ipa Payload/

      - name: Upload Artifact .ipa
        uses: actions/upload-artifact@v4
        with:
          name: cbt-ios-ipa
          path: ios/App/CBT-MTsN6Solok.ipa
