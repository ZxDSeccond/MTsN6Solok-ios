name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Build Script
        run: npm run build

      - name: Force Clean and Generate iOS Platform
        run: |
          rm -rf ios
          node ./node_modules/@capacitor/cli/bin/capacitor add ios

      - name: Build iOS App Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r CBT-MTsN6Solok.ipa Payload/

      - name: Upload Artifact .ipa
        uses: actions/upload-artifact@v4
        with:
          name: cbt-ios-ipa
          path: ios/App/CBT-MTsN6Solok.ipa
