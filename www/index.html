<script>
    let examActive = false;
    let violationCount = 0;
    let timerInterval = null;
    let timeLeft = 45 * 60;
    let html5QrCode = null;
    let scannerIsRunning = false;

    const RELOAD_ON_BACKGROUND_DELAY = 1200;

    function safeLog(message, data = null) {
        console.log(message, data || '');
    }

    function playWarningVoice() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 440;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } catch (e) {
            safeLog("Audio blocked", e);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const textAlert = "Pelanggaran terdeteksi! Jangan keluar dari aplikasi sebelum ujian selesai!";
            const utterance = new SpeechSynthesisUtterance(textAlert);
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showNotification(title, text, isError = true) {
        const msgBox = document.getElementById('msgBox');
        const titleEl = document.getElementById('msgTitle');
        const textEl = document.getElementById('msgText');
        const iconEl = document.getElementById('msgIcon');

        titleEl.innerText = title;
        textEl.innerText = text;

        if (isError) {
            iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>';
        } else {
            iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i>';
        }

        msgBox.classList.remove('translate-x-full');
        setTimeout(() => {
            msgBox.classList.add('translate-x-full');
        }, 4000);
    }

    async function startScanner() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showNotification("Kamera Tidak Didukung", "Browser ini tidak memungkinkan akses kamera.");
            return;
        }

        try {
            const cameras = await Html5Qrcode.getCameras();
            const backCamera = cameras.find(cam => {
                const label = (cam.label || '').toLowerCase();
                return label.includes('back') || label.includes('rear') || label.includes('environment');
            }) || cameras[0];

            if (html5QrCode === null) {
                html5QrCode = new Html5Qrcode("reader");
            }

            if (scannerIsRunning) {
                return;
            }

            await html5QrCode.start(
                backCamera ? { facingMode: "environment" } : { facingMode: "user" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.333
                },
                (decodedText) => {
                    document.getElementById('gformLink').value = decodedText;
                    showNotification("Barcode Ter-scan!", "Link soal berhasil dimasukkan dari QR Code.", false);
                    stopScanner();
                    toggleScannerModal();
                },
                () => {
                    // ignore errors during scan
                }
            );

            scannerIsRunning = true;
        } catch (err) {
            safeLog("Scanner start failed", err);
            showNotification("Gagal Kamera", "Pastikan izin kamera sudah diaktifkan dan coba lagi.");
            stopScanner();
        }
    }

    function stopScanner() {
        if (!html5QrCode) return;

        html5QrCode.stop()
            .then(() => {
                scannerIsRunning = false;
            })
            .catch(() => {
                scannerIsRunning = false;
            });
    }

    function toggleScannerModal() {
        const modal = document.getElementById('scannerModal');

        if (!modal) return;

        modal.classList.toggle('hidden');

        if (!modal.classList.contains('hidden')) {
            startScanner();
        } else {
            stopScanner();
        }
    }

    function handleStartExam(e) {
        e.preventDefault();

        const token = document.getElementById('examToken').value.trim().toUpperCase();
        const name = document.getElementById('studentName').value.trim();
        const id = document.getElementById('studentId').value.trim();
        let gformUrl = document.getElementById('gformLink').value.trim();

        if (token !== "SOLOK") {
            showNotification("Token Salah", "Token ujian untuk MTsN 6 Solok tidak valid. Coba ketik: SOLOK");
            return;
        }

        if (!gformUrl) {
            showNotification("Link Soal Kosong", "Masukkan link Google Form atau scan QR Code.");
            return;
        }

        if (gformUrl.includes('viewform')) {
            if (!gformUrl.includes('embedded=true')) {
                gformUrl += (gformUrl.includes('?') ? '&' : '?') + 'embedded=true';
            }
        }

        document.getElementById('displayStudentName').innerText = name;
        document.getElementById('displayStudentId').innerText = `ID: ${id}`;
        document.getElementById('gformFrame').src = gformUrl;

        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('examView').classList.remove('hidden');

        examActive = true;
        violationCount = 0;

        enterFullScreen();
        startTimer();

        showNotification("Kiosk Mode Aktif", "Ujian Google Form dimuat. Jangan berpindah tab!", false);
    }

    function enterFullScreen() {
        const elem = document.documentElement;

        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {
                safeLog("Fullscreen request blocked");
            });
        }
    }

    function handleViolation(reason) {
        if (!examActive) return;

        violationCount++;
        document.getElementById('violationCount').innerText = violationCount;

        playWarningVoice();

        if (violationCount >= 3) {
            showNotification("Ujian Dihentikan", "Anda melakukan pelanggaran Kiosk 3 kali. Ujian otomatis dikirim.");
            setTimeout(() => {
                finishExam();
            }, 2500);
        } else {
            showNotification("Pelanggaran Kiosk!", `${reason} Peringatan ke-${violationCount}/3.`);
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (examActive && document.hidden) {
            handleViolation("Tab / aplikasi lain terdeteksi!");
            setTimeout(() => {
                window.location.reload();
            }, RELOAD_ON_BACKGROUND_DELAY);
        }
    });

    document.addEventListener("fullscreenchange", () => {
        if (examActive && !document.fullscreenElement) {
            handleViolation("Keluar dari Mode Fullscreen Terdeteksi!");
            setTimeout(() => {
                enterFullScreen();
            }, 1000);
        }
    });

    window.addEventListener("blur", () => {
        if (examActive) {
            handleViolation("Aplikasi kehilangan fokus!");
            setTimeout(() => {
                window.location.reload();
            }, RELOAD_ON_BACKGROUND_DELAY);
        }
    });

    if (window.Capacitor) {
        const appApi = window.Capacitor.App;
        if (appApi && typeof appApi.addListener === 'function') {
            appApi.addListener('appStateChange', ({ isActive }) => {
                if (examActive && !isActive) {
                    safeLog("App backgrounded, reloading kiosk");
                    setTimeout(() => {
                        window.location.reload();
                    }, RELOAD_ON_BACKGROUND_DELAY);
                }
            });
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!examActive) return;

        const blockedKeys = ['F11', 'Escape', 'Tab', 'Meta', 'Control', 'Alt', 'Shift'];
        if (
            e.key === 'F11' ||
            e.key === 'Escape' ||
            e.key === 'Tab' ||
            (e.ctrlKey && ['c','v','u','r','w','t','l'].includes(e.key.toLowerCase())) ||
            (e.metaKey && ['c','v','u','r','w','t','l'].includes(e.key.toLowerCase()))
        ) {
            e.preventDefault();
            handleViolation("Pintasan Keyboard Terlarang Diblokir!");
        }
    });

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            document.getElementById('timerDisplay').innerText =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishExam();
            }
        }, 1000);
    }

    function confirmFinishExam() {
        if (confirm("Apakah Anda yakin telah selesai mengisi soal dan ingin mengakhiri ujian?")) {
            finishExam();
        }
    }

    function finishExam() {
        examActive = false;
        clearInterval(timerInterval);

        if (document.exitFullscreen && document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        }

        document.getElementById('examView').classList.add('hidden');
        document.getElementById('resultView').classList.remove('hidden');

        document.getElementById('resultName').innerText = document.getElementById('studentName').value;
        document.getElementById('resultId').innerText = document.getElementById('studentId').value;

        showNotification("Ujian Selesai", "Sesi ujian berhasil ditutup.", false);
    }

    function exitKioskModeToLogin() {
        location.reload();
    }
</script>
